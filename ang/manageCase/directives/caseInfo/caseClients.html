<div class="ci__case-info-item sc__position-relative sc__min-width-300 clientsField">
  <div class="panel sc__m-0">
    <div class="panel-heading">
      <div class="sc__flex sc__justify-content-space-between sc__position-relative">
        <span class="sc__flex sc__gap-5">
          <i class="crm-i fa-user"></i>
          <span>Client</span>
          <a ng-click="showHelpInfo('Client', 'id-client', 'CRM\/Supportcase\/Helper\/CaseInfo')" href="javascript:;" title="Help" class="helpicon"></a>
        </span>
        <div ng-show="!isEditMode" class="ci__case-info-edit-button" title="Edit client" ng-click="toggleMode();">
          <button ng-show="!isEditMode" class="btn btn-secondary sc__m-0">
            <i class="crm-i fa-pencil"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="panel-body">
      <div class="sc__min-height-70">
        <div class="sc__position-relative" ng-show="!isEditMode">
          <div class="ci__case-info-item-content">
            <div class="ci__clients-wrap">
              <div ng-repeat="clientContactId in model['client_ids']">
                <contact-info model="clientContactId" is-search-duplicates="true"></contact-info>
              </div>
            </div>
          </div>
        </div>

        <div class="ci__case-info-edit-mode" ng-show="isEditMode">
          <div ng-show="!isDoubleConfirmMode && !isNeedToShowConfirmationMessage">
            <select-contact is-required="true" search-api-params='{}' is-multiple="false" max-width="600" model="clientId"></select-contact>
          </div>

          <div ng-if="isNeedToShowConfirmationMessage">
            <div class="status">
              <p class="sc__mb-0 sc__mt-0"><strong>New Client:</strong></p>
              <contact-info model="clientId" is-search-duplicates="true"></contact-info>
            </div>
            <div class="status">
              <div class="sc__mb-10" ng-bind-html="confirmationMessage"></div>

              <button class="btn btn-primary sc__m-0" ng-click="updateClient()">
                <i class="crm-i fa-check"></i>
                <span>Confirm changing client</span>
              </button>
            </div>
          </div>

          <div class="status" ng-if="isNeedToShowConfirmationMessage">
            <strong>Adding to Related Contacts</strong>
            <p class="sc__mb-10 sc__mt-10">If you not sure if you need to change client, better to save this contact to "Related Contacts".</p>
            <button  class="btn btn-success sc__green-btn sc__m-0" ng-click="addContactToRelatedContacts()">
              <i class="crm-i fa-add"></i>
              <span>Add this Contact to Related Contacts</span>
            </button>
          </div>

          <div class="ci__case-info-errors-wrap" ng-show="!isDoubleConfirmMode"></div>

          <div class="sc__flex sc__justify-content-space-between sc__mt-10">
            <button ng-show="!isNeedToShowConfirmationMessage" class="btn btn-primary sc__m-0" ng-click="editConfirm()">
              <i class="crm-i fa-check"></i>
              <span>Confirm</span>
            </button>
            <button class="btn btn-secondary sc__m-0" ng-click="toggleMode()">
              <i class="crm-i fa-arrow-left"></i>
              <span>Cancel</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
